schema_version: 1
algorithm:
  components:
    deployment_configurator: deployment_algorithm_configurator
    policies: policies
    policy_mapping_fn: policy_mapping_fn
    training_configurator: training_algorithm_configurator
  name: PPO
  running_profile: single
  training_conditions:
    training_warmup_jitter_seconds: 30
    curriculum_switch:
      # Match SB3: release 5000 through 7000 active steps linearly.
      initial_time_limit_ratio: 0.7142857142857143
      entropy_range:
        lower: -0.2
        upper: 0.2
      # Eight-times the SB3 quota for the distributed sampling topology.
      min_terminated_episodes: 200
      # Recent completed episodes; distributed sampling keeps the 8x evidence scale.
      preferred_override_window_size: 200
      red_light_overdrive_rate_threshold:
        acceptable_range:
          upper: 0.2
        preferred_range:
          upper: 0.15
      termination_ratio_threshold:
        acceptable_range:
          lower: 0.6
        preferred_range:
          lower: 0.8
      time_limit_truncation_rate_threshold:
        acceptable_range:
          upper: 0.3
        preferred_range:
          upper: 0.25
      states:
      - name: intersection_3
        target_type: intersection
        target_value: 3
      - name: intersection_4
        target_type: intersection
        target_value: 4
      - name: intersection_5
        target_type: intersection
        target_value: 5
      - name: intersection_6
        target_type: intersection
        target_value: 6
      - name: intersection_7
        target_type: intersection
        target_value: 7
      - name: intersection_8
        target_type: intersection
        target_value: 8
    metrics:
      approx_kl_threshold:
        acceptable_range:
          upper: 0.02
        preferred_range:
          upper: 0.01
      clip_fraction_threshold:
        acceptable_range:
          upper: 0.05
        preferred_range:
          upper: 0.02
      entropy_loss_threshold:
        acceptable_range:
          lower: -0.5
          upper: 0.5
        preferred_range:
          lower: -0.2
          upper: 0.2
      episode_reward_stability:
        # Scenario promotion requires a strictly positive recent reward mean.
        target_mean_by_lookback_window: 0
      explained_variance_threshold:
        acceptable_range:
          lower: 0.6
        preferred_range:
          lower: 0.75
      policy_std_threshold:
        acceptable_range:
          lower: 0.05
          upper: 0.3
        preferred_range:
          lower: 0.08
          upper: 0.25
    scenario_switch:
      lookback_window_size: 5
      min_full_curriculum_episodes: 5
      # Eight-times the SB3 quota for the distributed sampling topology.
      min_terminated_episodes_for_switch_per_scenario: 200
      # Keep the override evidence on the same distributed sampling scale.
      preferred_override_window_size: 200
      red_light_overdrive_rate_threshold:
        acceptable_range:
          upper: 0.2
        preferred_range:
          upper: 0.15
      termination_ratio_threshold:
        acceptable_range:
          lower: 0.6
        preferred_range:
          lower: 0.8
      time_limit_truncation_rate_threshold:
        acceptable_range:
          upper: 0.3
        preferred_range:
          upper: 0.25
    training_verbosity: 0
checkpoint_saving_frequency: 50000
evaluation_deterministic: true
evaluation_frequency: 100000
model_implementation:
  module: lanista.rl_model_storage.models.susan_project.resources.ray.rl_model
  object: SusanRayModelPlugin
rl_engine_framework:
  uuid: ray
  version: 2.49.1
runtime:
  evaluation:
    n_eval_episodes: 1
    visualization: gui
    pacing: maximum-throughput
  scenario_selection:
    deployment_index: 20
    evaluation_index: 0
    training_start_index: 0
scenario_manager_configuration_file_path: resources/ray/scenario_manager_configuration.yaml
scenarios_folder_path: resources/training_scenarios
