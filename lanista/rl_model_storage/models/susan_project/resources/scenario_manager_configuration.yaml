random_scenarios_configuration:
  route_filename_prefix: route
  trip_filename_prefix: trip
  scenario_wrapper_directory_prefix: random_scenario
  number_of_scenarios: 20 # Number of random scenarios to generate

traffic_definition:

  general_vehicles_configuration:
    route_filename_prefix: vehicle_route
    trip_filename_prefix: vehicle_trip
    trip_attributes: maxSpeed="8.5" # Maximum speed of vehicles in m/s
    vehicle_class: passenger # Vehicle class for general vehicles
    begin_time: 0 # Start time of random trip distribution in SUMO simulation seconds
    end_time: 300 # End time of random trip distribution in SUMO simulation seconds
    fringe_factor: 10 # Factor the probability of a vehicle trips to be generated at the fringe of the area
    min_distance: 50 # Minimum distance between vehicles
    period: 1.5 # Distribution period of vehicle trips

  general_pedestrians_configuration:
    trip_filename_prefix: pedestrian_trip
    route_filename_prefix: pedestrian_route
    trip_attributes: type="pedestrian"
    prefix: pedestrian_ # Prefix for pedestrian trip files
    begin_time: 0 # Start time of random trip distribution in SUMO simulation seconds
    end_time: 500 # End time of random trip distribution in SUMO simulation seconds
    min_distance: 30 # Minimum distance between pedestrians
    max_distance: 100 # Maximum distance between pedestrians
    fringe_factor: 10 # Factor the probability of a pedestrian trips to be generated at the fringe of the area
    period: 5 # Distribution period of pedestrian trips
    desired_max_speed: 0.6 # Desired maximum speed of pedestrians in m/s

traffic_flow_definition:

  adaptive_vehicle_flow_configuration:
    initial_number_of_vehicles: 10 # Initial traffic exposure for the first scenario
    target_number_of_vehicles: 200 # Target number of vehicles for the last scenario

  adaptive_pedestrian_flow_configuration:
    initial_number_of_pedestrians: 1 # Initial pedestrian exposure for the first scenario
    target_number_of_pedestrians: 25 # Target number of pedestrians for the last scenario

sumo_configuration:
  network_filename: ZalaZone_full.net.xml # Network file for the simulation
  gui_settings_filename: gui-settings.xml # GUI settings file for the simulation

simulation_configuration:
  begin_time: 0 # SUMO simulation start time in seconds
  end_time: 3600 # Covers max warmup + startup + all 7000 active policy steps (required maximum: 410.05 s)
  time_to_teleport: -1 # SUMO teleport timeout in simulation seconds; -1 means no teleportation
  step_length: 0.05 # Step length for the realtime simulation in seconds
  max_timesteps: 7000 # Guaranteed policy-controlled steps after warmup (350 active simulation seconds)
  no_warnings: true # Whether to suppress warnings in the simulation
